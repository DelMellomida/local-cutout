name: Bug report
description: Report a reproducible problem with Local Cutout
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Do not attach private or sensitive images.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Remove personal information before pasting logs.
